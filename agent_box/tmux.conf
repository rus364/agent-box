# agent-box uses tmux only as a detach/reattach shim around one agent
# session, never as a window manager: the agent draws a full-screen TUI and
# tmux must stay out of its way. Everything here either keeps tmux invisible
# or keeps a detached session alive after the terminal that started it dies.

# No status bar: the agent owns every row of the terminal.
set -g status off

# A TUI reads escape sequences itself; tmux must not sit on them waiting to
# see whether Escape starts a key binding.
set -g escape-time 0
set -g focus-events on

# The point of the whole exercise: losing the last client (a closed terminal
# included) must never end the session.
set -g destroy-unattached off

# Colour must survive the extra terminal layer; the image ships this terminfo
# entry, and RGB restores 24-bit colour that a bare tmux would quantise.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# The host's own tmux almost certainly owns C-b. An inner prefix that the
# outer tmux never sees means no nesting gymnastics for the common case.
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

set -g history-limit 20000
