[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-tool"
version = "1.0.1"
description = "Run coding agents in rootless Podman workspace boxes"
dynamic = ["readme", "urls"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
agent-box = "agent_box.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["agent_box*"]
namespaces = false

[tool.setuptools.package-data]
agent_box = ["Containerfile", ".containerignore", "container-launcher", "*.sh", "*.conf", "completion.*", "skills/**/*"]

[tool.agent-box.release]
repository = "https://github.com/rus364/agent-box"
readme = "README.md"
changelog = "CHANGELOG.md"

[tool.agent-box.release.urls]
Homepage = "{repository}"
Documentation = "{repository}/blob/{tag}/docs/README.md"
Repository = "{repository}"
Issues = "{repository}/issues"
Changelog = "{repository}/blob/{tag}/CHANGELOG.md"

[tool.agent-box.aur]
name = "agent-box"
maintainer = "rus364 <rus364@gmail.com>"
