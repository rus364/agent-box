[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-box-tool"
version = "1.0.0"
description = "Run coding agents in rootless Podman workspace boxes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/rus364/agent-box"
Documentation = "https://github.com/rus364/agent-box/blob/main/docs/README.md"
Repository = "https://github.com/rus364/agent-box"
Issues = "https://github.com/rus364/agent-box/issues"
Changelog = "https://github.com/rus364/agent-box/blob/main/CHANGELOG.md"

[project.scripts]
agent-box = "agent_box.cli:main"

[tool.setuptools.packages.find]
include = ["agent_box*"]
namespaces = false

[tool.setuptools.package-data]
agent_box = ["Containerfile", ".containerignore", "container-launcher", "*.sh", "*.conf", "completion.*", "skills/**/*"]
