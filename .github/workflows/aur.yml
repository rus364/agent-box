name: AUR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable GitHub/PyPI release (e.g. 1.0.1)'
        required: true
        type: string
      revision:
        description: 'Arch pkgrel (increase for packaging-only corrections)'
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/aur-build.yml
    with:
      version: ${{ inputs.version }}
      revision: ${{ inputs.revision }}

  publish:
    needs: build
    uses: ./.github/workflows/aur-publish.yml
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    with:
      artifact-id: ${{ needs.build.outputs.artifact-id }}
