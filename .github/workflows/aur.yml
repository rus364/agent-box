name: AUR

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing stable GitHub/PyPI release (e.g. 1.0.1)'
        required: true
        type: string
      revision:
        description: 'Arch pkgrel (increase for packaging-only corrections)'
        default: '1'
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'rus364/agent-box'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the released source in Arch
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_REVISION: ${{ inputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/arch-result"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/arch-result:/result" \
            archlinux:base@sha256:363129b67b2bc6c5a634f8fb4961a7e2eba213a2ec075d159127b1260290a722 \
            bash /repo/tools/check_arch.sh release /result "$PACKAGE_VERSION" "$PACKAGE_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: aur-metadata
          path: ${{ runner.temp }}/arch-result/metadata/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: aur
    concurrency:
      group: aur-agent-box-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: aur-metadata
          merge-multiple: true
          digest-mismatch: error
      - name: Push checked metadata to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          test -n "$AUR_SSH_PRIVATE_KEY"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$keydir/id_ed25519"
          unset AUR_SSH_PRIVATE_KEY
          export GIT_SSH_COMMAND="ssh -i $keydir/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/packaging/aur/known_hosts"
          python tools/aur.py publish --directory aur-metadata
