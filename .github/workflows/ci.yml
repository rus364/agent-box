name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"
          args: "check --select E4,E9,F agent_box/ tests/ tools/ setup.py"

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure test Git identity
        run: |
          git config --global user.name "agent-box CI"
          git config --global user.email "agent-box-ci@example.invalid"

      - name: Run fast self-tests
        run: python -m agent_box selftest

      - name: Run full test suite
        run: python tests/run_suite.py

      - name: Build and check installed distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 pipx==1.18.3 uv==0.13.1
          python -m build
          python -m twine check --strict dist/*
          python tools/release.py artifacts --install
