name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run Ruff
        run: |
          python -m pip install ruff==0.17.1
          ruff check --select E4,E9,F agent_box/ tests/ tools/ setup.py

  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure test Git identity
        run: |
          git config --global user.name "agent-box CI"
          git config --global user.email "agent-box-ci@example.invalid"

      - name: Run fast self-tests
        run: python -m agent_box selftest

      - name: Run full test suite
        run: python tests/run_suite.py

      - name: Build and check installed distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 pipx==1.18.3 uv==0.13.1
          python -m build
          python -m twine check --strict dist/*
          python tools/release.py artifacts --install

  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test native packaging
        run: |
          mkdir -p "$RUNNER_TEMP/arch-result"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v "$RUNNER_TEMP/arch-result:/result" \
            archlinux:base@sha256:363129b67b2bc6c5a634f8fb4961a7e2eba213a2ec075d159127b1260290a722 \
            bash /repo/tools/check_arch.sh candidate /result
