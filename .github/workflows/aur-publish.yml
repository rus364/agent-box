name: Publish AUR metadata

on:
  workflow_call:
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
    inputs:
      artifact-id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'rus364/agent-box'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: aur
    concurrency:
      group: aur-agent-box-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: aur-metadata
          merge-multiple: true
          digest-mismatch: error
      - name: Push checked metadata to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          test -n "$AUR_SSH_PRIVATE_KEY"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$keydir/id_ed25519"
          unset AUR_SSH_PRIVATE_KEY
          export GIT_SSH_COMMAND="ssh -i $keydir/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/packaging/aur/known_hosts"
          python tools/aur.py publish --directory aur-metadata
